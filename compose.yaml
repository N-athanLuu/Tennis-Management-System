services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://tennis:tennis@db:5432/tennis
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./src:/app/src
    depends_on:
      - db

volumes:
  pgdata: