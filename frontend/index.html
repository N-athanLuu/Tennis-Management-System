<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div class="page" id="home" x-data="tennisApp" :class="{ 'dashboard-page': user }" @hashchange.window="navigate">
      <div class="court" aria-hidden="true" x-show="sessionReady && !user" x-cloak><div class="singles"></div><div class="service"></div><div class="net"></div></div>
      <header x-show="sessionReady && !user" x-cloak>
        <span class="brand">◉ Carden Dang, Nathan Luu, Troy Quach</span>
        <nav class="account-nav" aria-label="Account">
          <a href="#login">Log in</a>
        </nav>
      </header>
      <main class="landing" x-show="sessionReady && !user" x-cloak>
        <template x-if="accountPage">
          <section class="account-panel" aria-labelledby="account-title">
            <a href="#home">← Back to home</a>
            <h1 id="account-title" x-text="signup ? 'Sign up' : 'Welcome back.'"></h1>
            <form @submit.prevent="submit">
              <template x-if="signup">
                <label>Full name<input name="name" autocomplete="name" required></label>
              </template>
              <label>Email address<input name="email" type="email" autocomplete="email" required></label>
              <label>Password<input name="password" type="password" :autocomplete="signup ? 'new-password' : 'current-password'" :minlength="signup ? 8 : null" required></label>
              <small x-show="signup">Use at least 8 characters.</small>
              <template x-if="signup">
                <label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
              </template>
              <button class="button" type="submit" :disabled="busy" x-text="busy ? 'Please wait… ↗' : signup ? 'Sign up ↗' : 'Log in ↗'"></button>
              <p role="status" x-text="message"></p>
            </form>
            <p><span x-text="signup ? 'Already have an account?' : 'New here?'"></span> <a :href="signup ? '#login' : '#signup'" x-text="signup ? 'Log in' : 'Sign up'"></a></p>
          </section>
        </template>
        <template x-if="!accountPage">
          <div>
            <p class="eyebrow">● &nbsp; MANAGING MATCHPLAY AND LEADERBOARD</p>
            <h1>Racquet Sport<br>Management <em>System</em></h1>
            <p class="intro">Your next great match starts here. A simple space to bring the tennis, pickleball, and badminton community together, on and off the court.</p>
            <div class="caption" style="justify-content: flex-end"><span>GAME. SET. GO.</span></div>
          </div>
        </template>
      </main>
      <main class="club-dashboard" aria-label="Club activity" x-show="user" x-cloak>
        <aside class="club-sidebar">
          <p class="label">YOUR CLUB</p>
          <nav aria-label="Club sections">
            <button type="button" :aria-pressed="clubTab === 'overview'" @click="clubTab = 'overview'"><span aria-hidden="true">▤</span> Overview</button>
            <button type="button" :aria-pressed="clubTab === 'leaderboard'" @click="clubTab = 'leaderboard'"><span aria-hidden="true">♛</span> Leaderboard</button>
            <button type="button" :aria-pressed="clubTab === 'schedules'" @click="clubTab = 'schedules'"><span aria-hidden="true">▦</span> Schedules</button>
          </nav>
        </aside>
        <section class="club-content" aria-labelledby="club-heading" aria-live="polite">
          <div class="club-toolbar">
            <p class="label" x-show="activeTab.label" x-text="activeTab.label"></p>
            <button class="logout-button" type="button" @click="logout" :disabled="busy">Log out</button>
          </div>
          <p role="status" x-show="message" x-text="message"></p>
          <h2 id="club-heading" x-text="activeTab.title"></h2>
          <p class="club-description" x-show="activeTab.description" x-text="activeTab.description"></p>
          <div class="club-overview" x-show="clubTab === 'overview'">
            <label class="sport-picker">
              Sports
              <select x-model="selectedSport">
                <option value="tennis">Tennis</option>
                <option value="pickleball">Pickleball</option>
                <option value="badminton">Badminton</option>
              </select>
            </label>
            <div class="tennis-courts" x-show="selectedSport === 'tennis'">
              <template x-for="court in tennisCourts" :key="court.number">
                <section class="tennis-court-card" :aria-labelledby="'court-title-' + court.number">
                  <div class="tennis-court-visual">
                    <h3 :id="'court-title-' + court.number" x-text="'Court ' + court.number"></h3>
                    <div class="tennis-court-drawing" aria-hidden="true">
                      <div class="tennis-court-singles"></div>
                      <div class="tennis-court-service"></div>
                      <div class="tennis-court-net"></div>
                    </div>
                  </div>
                  <div class="tennis-court-info">
                    <dl class="tennis-court-status">
                      <dt>Status</dt>
                      <dd></dd>
                    </dl>
                    <details class="tennis-court-queue"
                      @click.outside="$el.open = false"
                      @keydown.escape.stop="if ($el.open) { $el.open = false; $el.querySelector('summary').focus() }">
                      <summary>
                        <span :id="'court-queue-' + court.number" x-text="'Queue: ' + court.queue.length"></span>
                        <span class="queue-chevron" aria-hidden="true"></span>
                      </summary>
                      <ol :aria-labelledby="'court-queue-' + court.number">
                        <template x-for="player in court.queue">
                          <li x-text="player"></li>
                        </template>
                      </ol>
                    </details>
                  </div>
                </section>
              </template>
            </div>
          </div>
          <div class="standings-scroll" x-show="clubTab === 'leaderboard'">
            <table class="standings">
              <caption class="visually-hidden">Club leaderboard</caption>
              <thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Played</th><th scope="col">Wins</th><th scope="col">Points</th></tr></thead>
              <tbody><tr><td colspan="5">No rankings yet. Standings will appear once match results are available.</td></tr></tbody>
            </table>
          </div>
          <div class="sport-schedules" x-show="clubTab === 'schedules'">
            <template x-for="sport in ['Badminton', 'Tennis', 'Pickleball']" :key="sport">
              <section class="schedule-empty" :aria-labelledby="'schedule-' + sport.toLowerCase()">
                <span aria-hidden="true">▦</span>
                <h3 :id="'schedule-' + sport.toLowerCase()" x-text="sport"></h3>
                <p x-text="'No ' + sport.toLowerCase() + ' matches are scheduled yet. Upcoming matches will appear here.'"></p>
              </section>
            </template>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
